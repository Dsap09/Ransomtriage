[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ransomtriage"
version = "1.0.0"
description = "Automated Execution Chain Analyzer for Windows Forensics"
readme = "README.md"
requires-python = ">=3.9"


dependencies = [
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "jinja2>=3.0.0",
    "tqdm>=4.60.0",
    "python-registry>=1.3.1",
]

[project.scripts]
ransomtriage = "ransomtriage.cli:main"
